worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    log_format form '$time_local - $status - PORT: $upstream_addr'; 
    access_log logs/access.log form; 

    upstream backend {
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://backend;
        }
    }
}